<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C239B3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C239B3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="640" stroke="white" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="640" stroke="white" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="640" stroke="white" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="640" stroke="white" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="640" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="640" stroke="white" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="640" stroke="white" stroke-width="1"/>
    <line x1="280" y1="0" x2="280" y2="640" stroke="white" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="white" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="640" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="640" stroke="white" stroke-width="1"/>
    <line x1="440" y1="0" x2="440" y2="640" stroke="white" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="640" stroke="white" stroke-width="1"/>
    <line x1="520" y1="0" x2="520" y2="640" stroke="white" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="640" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="640" stroke="white" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="white" stroke-width="1"/>
    <line x1="680" y1="0" x2="680" y2="640" stroke="white" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="640" stroke="white" stroke-width="1"/>
    <line x1="760" y1="0" x2="760" y2="640" stroke="white" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="640" stroke="white" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="640" stroke="white" stroke-width="1"/>
    <line x1="880" y1="0" x2="880" y2="640" stroke="white" stroke-width="1"/>
    <line x1="920" y1="0" x2="920" y2="640" stroke="white" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="white" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="640" stroke="white" stroke-width="1"/>
    <line x1="1040" y1="0" x2="1040" y2="640" stroke="white" stroke-width="1"/>
    <line x1="1080" y1="0" x2="1080" y2="640" stroke="white" stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="640" stroke="white" stroke-width="1"/>
    <line x1="1160" y1="0" x2="1160" y2="640" stroke="white" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="640" stroke="white" stroke-width="1"/>
    <line x1="1240" y1="0" x2="1240" y2="640" stroke="white" stroke-width="1"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="white" stroke-width="1"/>
    <line x1="0" y1="40" x2="1280" y2="40" stroke="white" stroke-width="1"/>
    <line x1="0" y1="80" x2="1280" y2="80" stroke="white" stroke-width="1"/>
    <line x1="0" y1="120" x2="1280" y2="120" stroke="white" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1280" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="white" stroke-width="1"/>
    <line x1="0" y1="280" x2="1280" y2="280" stroke="white" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="white" stroke-width="1"/>
    <line x1="0" y1="360" x2="1280" y2="360" stroke="white" stroke-width="1"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="white" stroke-width="1"/>
    <line x1="0" y1="440" x2="1280" y2="440" stroke="white" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="white" stroke-width="1"/>
    <line x1="0" y1="520" x2="1280" y2="520" stroke="white" stroke-width="1"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="white" stroke-width="1"/>
    <line x1="0" y1="600" x2="1280" y2="600" stroke="white" stroke-width="1"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="200" fill="url(#accent)" opacity="0.05" />
  <circle cx="180" cy="540" r="150" fill="url(#accent)" opacity="0.05" />

  <!-- Accent line at top -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent2)" />

  <!-- App icon (scaled down from icon.svg) -->
  <g transform="translate(200, 190) scale(0.5)">
    <!-- Background circle -->
    <circle cx="256" cy="256" r="220" fill="url(#accent)"/>
    <!-- Camera body -->
    <rect x="120" y="180" width="272" height="216" rx="30" fill="#FFFFFF" opacity="0.95"/>
    <!-- Camera lens -->
    <circle cx="256" cy="288" r="90" fill="url(#accent)"/>
    <circle cx="256" cy="288" r="70" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="256" cy="288" r="50" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="256" cy="288" r="30" fill="#FFFFFF" opacity="0.8"/>
    <!-- Viewfinder -->
    <rect x="150" y="130" width="90" height="60" rx="12" fill="#FFFFFF" opacity="0.95"/>
    <rect x="155" y="135" width="80" height="50" rx="8" fill="url(#accent)"/>
    <!-- Record button -->
    <circle cx="340" cy="210" r="20" fill="#FF5252"/>
    <circle cx="340" cy="210" r="15" fill="#FFFFFF" opacity="0.3"/>
    <!-- Ninja element -->
    <g transform="translate(180, 210)">
      <path d="M 0,-15 L 3,-3 L 15,0 L 3,3 L 0,15 L -3,3 L -15,0 L -3,-3 Z" fill="#333333" opacity="0.2"/>
    </g>
  </g>

  <!-- App name -->
  <text x="530" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="white" letter-spacing="-1">
    Video<tspan fill="url(#accent)">Ninja</tspan>
  </text>

  <!-- Tagline -->
  <text x="530" y="355" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#8892b0" font-weight="400">
    A beautiful, user-friendly video downloader
  </text>

  <!-- Feature pills -->
  <g transform="translate(530, 400)">
    <!-- Electron pill -->
    <rect x="0" y="0" width="110" height="36" rx="18" fill="#FF6B9D" opacity="0.15" stroke="#FF6B9D" stroke-width="1" stroke-opacity="0.3"/>
    <text x="55" y="23" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#FF6B9D" text-anchor="middle" font-weight="500">Electron</text>

    <!-- yt-dlp pill -->
    <rect x="125" y="0" width="90" height="36" rx="18" fill="#FF6B9D" opacity="0.15" stroke="#FF6B9D" stroke-width="1" stroke-opacity="0.3"/>
    <text x="170" y="23" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#FF6B9D" text-anchor="middle" font-weight="500">yt-dlp</text>

    <!-- Cross-platform pill -->
    <rect x="230" y="0" width="150" height="36" rx="18" fill="#FF6B9D" opacity="0.15" stroke="#FF6B9D" stroke-width="1" stroke-opacity="0.3"/>
    <text x="305" y="23" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#FF6B9D" text-anchor="middle" font-weight="500">Cross-platform</text>

    <!-- Open Source pill -->
    <rect x="395" y="0" width="130" height="36" rx="18" fill="#FF6B9D" opacity="0.15" stroke="#FF6B9D" stroke-width="1" stroke-opacity="0.3"/>
    <text x="460" y="23" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#FF6B9D" text-anchor="middle" font-weight="500">Open Source</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="636" width="1280" height="4" fill="url(#accent2)" />
</svg>