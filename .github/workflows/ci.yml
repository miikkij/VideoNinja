name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm from package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test
        run: pnpm check

      - name: Audit dependencies
        run: pnpm run audit

      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install verified media tools
        run: node scripts/setup-media-tools.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Exercise actual media downloads and conversion
        run: pnpm test:media

      - name: Configure Linux source sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Smoke test source on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:smoke

      - name: Smoke test source on Windows and macOS
        if: runner.os != 'Linux'
        run: pnpm test:smoke

      - name: Build native application and installers
        run: pnpm build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Configure Linux packaged sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox

      - name: Smoke test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:smoke --packaged

      - name: Smoke test packaged application on Windows and macOS
        if: runner.os != 'Linux'
        run: pnpm test:smoke --packaged

      - name: Exercise advanced packaged workflows on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:features --packaged

      - name: Exercise advanced packaged workflows on Windows and macOS
        if: runner.os != 'Linux'
        run: pnpm test:features --packaged

      - name: Verify expected package artifacts
        run: pnpm release:verify --artifacts

      - name: Smoke test native package on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/installer-smoke.mjs

      - name: Smoke test native package on Windows and macOS
        if: runner.os != 'Linux'
        run: node scripts/installer-smoke.mjs

      - name: Upload verified packages and screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
            test-results/*.png
